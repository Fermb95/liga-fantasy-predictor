name: Actualizar datos LaLiga Fantasy
on:
  schedule:
    - cron: '0 4,5,16,17 * * *'   # ~06:00 y 18:00 hora de España
  workflow_dispatch: {}
jobs:
  ingest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install "requests>=2.31" "libsql-client>=0.3"
      - env:
          TURSO_DATABASE_URL: ${{ secrets.TURSO_DATABASE_URL }}
          TURSO_AUTH_TOKEN: ${{ secrets.TURSO_AUTH_TOKEN }}
        run: python -m src.ingest
